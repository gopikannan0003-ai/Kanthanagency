<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kanthan Agency</title>

    <!-- Attractive Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Montserrat:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="home.css">

</head>


<body>

    <section class="home">

        <!-- Background overlay -->
        <div class="overlay"></div>


        <div class="content">

            <!-- LOGO -->
            <div class="logo-container">

                <div class="logo-glow"></div>

                <img
                    src="images/logo.jpeg"
                    alt="Kanthan Agency"
                    class="logo"
                >

            </div>


            <!-- Main heading -->
            <h1>
                Light Up Your
                <span>Special Moments</span>
            </h1>


            <!-- Small line -->
            <div class="gold-line">
                <span></span>
                <i>✦</i>
                <span></span>
            </div>


            <!-- Small content -->
            <p>
                Discover quality crackers and
                make every celebration memorable.
            </p>


            <!-- Button -->
            <button
                class="explore-button"
                onclick="location.href='productview.html'">

                <span>Explore Products</span>

                <b>→</b>

            </button>


            <!-- Bottom text -->
            <div class="bottom-text">
                KANTHAN AGENCY
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
