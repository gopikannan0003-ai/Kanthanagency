<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sivakasi Crackers — Order Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="product.css">
</head>
<body>

<header>
  <h1>🎆 Kanthan Crackers</h1>
  <p class="sub">Select items, enter quantity — total &amp; WhatsApp order auto-generated</p>
  <div class="search-row">
    <input type="text" id="searchBox" placeholder="Search a product…" autocomplete="off">
  </div>
</header>

<main id="listArea"></main>

<div class="cart-bar">
  <div class="cart-info">
    <span class="cart-count" id="cartCount">0 items selected</span>
    <span class="cart-total" id="cartTotal">₹0</span>
    <span class="cart-savings" id="cartSavings"></span>
  </div>
  <button class="send-btn" id="sendBtn" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.08c-.24.68-1.4 1.31-1.93 1.35-.5.05-.96.24-3.24-.68-2.75-1.11-4.53-3.85-4.67-4.03-.14-.18-1.12-1.49-1.12-2.85 0-1.35.71-2.02.96-2.29.24-.27.53-.34.71-.34h.5c.16 0 .38-.01.58.44.24.55.81 1.9.88 2.04.07.14.11.3.02.48-.09.18-.14.29-.27.44-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.94 1.93 1.23 2.2 1.37.27.14.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.37-.22.61-.13.25.09 1.58.75 1.85.88.27.14.45.2.51.32.07.11.07.66-.17 1.34z"/></svg>
    Send via WhatsApp
  </button>
</div>
<p class="wa-note" id="waNote"></p>

<script src="products.js"></script>
</body>
</html>
